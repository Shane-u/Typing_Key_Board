server {
    listen 80;
    server_name localhost;

    # 静态文件目录
    root /usr/share/nginx/html;
    index index.html;

    # SPA应用路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
} 